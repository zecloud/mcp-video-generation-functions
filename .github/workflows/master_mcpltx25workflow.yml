# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure Functions: https://aka.ms/python-webapps-actions

name: Build and deploy Python project to Azure Function App - mcpltx25workflow

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'function-package/'
  PYTHON_VERSION: '3.14' # set this to the python version to use (supports 3.6, 3.7, 3.8)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate Durable Task Scheduler configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          host = json.loads(Path("src/host.json").read_text())
          provider = host["extensions"]["durableTask"]["storageProvider"]
          assert provider == {
              "type": "azureManaged",
              "connectionStringName": "DURABLE_TASK_SCHEDULER_CONNECTION_STRING",
          }
          PY

      - name: Zip artifact for deployment
        run: |
          mkdir "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}"
          rsync -a \
            --exclude='.funcignore' \
            --exclude='.venv/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='local.settings.json' \
            --exclude='tests/' \
            src/ "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}"
          (cd "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}" && zip -r ../release.zip .)
          test ! -e "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/local.settings.json"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Unzip artifact for deployment
        run: |
          mkdir "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}"
          unzip release.zip -d "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}"
          rm release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1D7DC791BA5348D596E77AF85B35AED8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6DFBEC89334A4543A0AAB1764E7B1C03 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AD2E6925918E487891B0CABABB1CE0B0 }}

      - name: 'Deploy to Azure Functions'
        uses: Azure/functions-action@v1
        id: deploy-to-function
        with:
          app-name: 'mcpltx25workflow'
          slot-name: 'Production'
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          sku: flexconsumption
          remote-build: true
